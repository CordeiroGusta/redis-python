version: 3.8

services:
  redis:
    image: redis:alpine
    container_name: ${REDIS_HOST_NAME:-redis_container}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - rede_privada
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"] #comando que testa a conexão do redis no container
      interval: 5s #intervalo de tempo a cada teste, a cada 5 segundos
      timeout: 3s #espera no maximo 3 segundos por resposta do test
      retries: 3 #tenta 3 vezes antes de declarar o serviço com 'unhealthy', ou seja, que não esta pronto
      start_period: 2s #periodo de tolerancia para o redis inicializar
    
  app:
    build: .
    container_name: app_python
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD = ${REDIS_PASSWORD}
    ports:
      -"${APP_PORT:-8000}:8000"
    networks:
      - rede_privada
      - rede_publica
    depends_on:
      redis:
        condition: service_healthy
    
networks:
  rede_privada:
    driver: bridge
  rede_publica:
    driver: bridge