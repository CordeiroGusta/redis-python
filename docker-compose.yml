services:
  redis:
    image: redis:alpine
    container_name: ${REDIS_HOST_NAME:-redis_container}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"] 
      interval: 5s 
      timeout: 3s
      retries: 3 
      start_period: 5s
    volumes:
      - 'redis_data:/data'

volumes:
  redis_data:
